# firewall daemon configuration file
# Lines starting with # or ; are comments

# Max failed attempts before banning an IP
max_retries=5

# Time window for counting failed attempts (in seconds)
findtime=600

# Ban duration (in seconds)
ban_time=900

# Check interval (in seconds)
interval=1

# Whether to daemonize (true/false or 1/0)
daemonize=false

# Log files to monitor (can have multiple)
log_file=/var/log/auth.log
log_file=/var/log/secure
log_file=/var/log/vsftpd.log
log_file=/var/log/nginx/error.log

# Prometheus metrics exporter port (0 to disable)
metrics_port=9119

# ============================================================================
# Log parsing regex patterns (POSIX Extended regex)
# Each pattern must have at least one capture group for IP address extraction
# The LAST capture group in the match is used as the IP address
# Leave empty to use built-in defaults
# ============================================================================

# SSH failed password pattern
# Default: matches "Failed password for [invalid user ]<user> from <IP> port <port>"
# Example custom: sshd_regex=Failed password for .* from ([0-9.]+)
sshd_regex=

# vsftpd failed login pattern
# Default: matches "FAIL LOGIN: [Cc]lient[=\"]<IP>"
# Example custom: vsftpd_regex=FAIL LOGIN.*([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)
vsftpd_regex=

# nginx 401 unauthorized pattern
# Default: matches "<IP> ... "GET ... HTTP/1.1" 401"
# Example custom: nginx_regex=([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*" 401
nginx_regex=