site_name: Firewall
site_description: Linux Kernel Module Version of fail2ban — Real-time IP Ban Protection
site_author: SnowCore8
site_url: https://snowcore8.github.io/linux-firewall-kmod/
repo_url: https://github.com/SnowCore8/linux-firewall-kmod
repo_name: SnowCore8/linux-firewall-kmod
docs_dir: site-docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SnowCore8/linux-firewall-kmod
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

nav:
  - 快速开始:
      - 项目介绍: index.md
      - 安装部署: operations.md
      - 配置指南: configuration.md
  - 深入理解:
      - 架构设计: architecture.md
      - 安全特性: security.md
      - 永久封禁: permanent-ban.md
  - 运维与使用:
      - 运维手册: operations.md
      - 常见问题: faq.md
      - 迁移指南: migration.md
  - 开发与贡献:
      - 贡献指南: contributing.md
      - Git 工作流: git-workflow.md
      - 测试框架: testing.md
  - 其他:
      - 变更日志: changelog.md

copyright: Copyright &copy; 2026 SnowCore8

plugins:
  - search
  - minify:
      minify_html: true
