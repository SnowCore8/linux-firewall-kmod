<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <!-- 桌面优先视口：允许缩放（可访问性要求），保留安全区适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Firewall — 实时 IP 封禁防护系统控制面板">
    <!-- PWA：主题色与暗色首屏底色一致，避免加载时白闪 -->
    <meta name="theme-color" content="#05080d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Firewall — Command Center</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect x='2' y='2' width='36' height='36' rx='2' fill='none' stroke='%2313aebf' stroke-width='2'/><path d='M20 10L10 16V24L20 30L30 24V16L20 10Z' fill='none' stroke='%2313aebf' stroke-width='2' stroke-linejoin='round'/><circle cx='20' cy='20' r='4' fill='%2313aebf'/></svg>">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <!--
      首屏防闪烁：在 React 挂载前按已持久化的偏好解析出暗/亮并写到 <html>。
      与 ThemeProvider 读的是同一个 localStorage 键（firewall.theme.preference）与同一套
      取值（system/dark/light）；system 走 prefers-color-scheme。底色也在此刻铺好，
      避免暗色主题下先闪一帧白底。
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('firewall.theme.preference');
          var pref = raw ? JSON.parse(raw) : 'system';
          if (pref !== 'dark' && pref !== 'light') pref = 'system';
          var dark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.background = dark ? '#05080d' : '#f4f6f8';
          var dRaw = localStorage.getItem('firewall.theme.density');
          var density = dRaw ? JSON.parse(dRaw) : 'standard';
          root.setAttribute('data-density', density === 'compact' ? 'compact' : 'standard');
        } catch (e) { /* 存储不可用时保持 index.html 上的默认 data-theme=dark */ }
      })();
    </script>
    <!-- Non-blocking: unreachable Google Fonts must not stall the app module script. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    </noscript>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
