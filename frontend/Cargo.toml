[package]
name = "firewall-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
gloo-net = "0.6"
gloo-events = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlDocument",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Window",
    "Document",
    "Element",
    "CssStyleDeclaration",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "EventSource",
    "MessageEvent",
    "EventSourceInit",
    "AddEventListenerOptions",
    "Performance",
    "SvgsvgElement",
    "SvgPathElement",
    "SvgCircleElement",
    "SvgTextElement",
    "SvgLineElement",
    "SvgRectElement",
    "SvgElement",
    "NodeList",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "ScrollLogicalPosition",
    "DomRect",
    "MediaQueryList",
    "Storage",
] }
console_error_panic_hook = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
