# firewall daemon configuration for frps protection
# Monitors frp log for suspicious connections on port 2222

# Max failed attempts before banning an IP
max_retries=10

# Time window for counting failed attempts (in seconds)
findtime=300

# Ban duration (in seconds)
ban_time=3600

# Check interval (in seconds)
interval=2

# Whether to daemonize (true/false or 1/0)
daemonize=true

# Log files to monitor - frp log
log_file=/root/frp/frp.log

# Prometheus metrics exporter port (0 to disable)
metrics_port=9120

# Log parsing regex patterns
sshd_regex=
vsftpd_regex=
nginx_regex=
frp_regex=
