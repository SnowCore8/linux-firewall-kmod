# firewall daemon configuration file
# Default configuration: protects only sshd (SSH service)

# Global defaults - applied to all jails unless overridden
defaults:
  max_retries: 5
  findtime: 600
  ban_time: 900
  interval: 1
  metrics_port: 9119

# Jail definitions
jails:
  sshd:
    enabled: true
    log_files:
      - /var/log/auth.log
      - /var/log/secure
    max_retries: 5
    findtime: 600
    ban_time: 900
    regex: ""  # Empty string uses built-in sshd pattern

  frp:
    enabled: true
    log_files:
      - /var/log/frp/frp.log
    max_retries: 10
    findtime: 300
    ban_time: 1800
    # 匹配 FRP 错误/警告日志中的远程 IP 地址（使用捕获组提取 IP）
    # 示例：2026-04-22 17:52:16.417 [E] [...] remoteAddr: 43.100.123.123:7000
    regex: ".*\\[E\\].*remoteAddr:\\s*([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)|.*\\[W\\].*remoteAddr:\\s*([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)"

# Permanent ban configuration (SQLite-based persistence)
# Path to SQLite database file for permanent bans (empty = disabled)
# Use absolute path in a secure location with proper permissions
permanent_db_path: "/var/lib/firewall/bans.db"
# Whether to enable permanent bans (true/false)
permanent_ban_enabled: true
