# firewall daemon configuration file
# Default configuration: protects only sshd (SSH service)

# Max failed attempts before banning an IP
max_retries: 5

# Time window for counting failed attempts (in seconds)
findtime: 600

# Ban duration (in seconds)
ban_time: 900

# Check interval (in seconds)
interval: 1

# Whether to daemonize (true/false)
daemonize: false

# Log files to monitor - only sshd
log_files:
  - /var/log/auth.log
  - /var/log/secure

# Prometheus metrics exporter port (0 to disable)
metrics_port: 9119

# Log parsing regex patterns (POSIX Extended regex)
# Only sshd is supported by default
regex_patterns:
  # SSH failed password pattern
  sshd: ""

# Permanent ban configuration (SQLite-based persistence)
# Path to SQLite database file for permanent bans (empty = disabled)
permanent_db_path: ""
# Whether to enable permanent bans (true/false)
permanent_ban_enabled: false
