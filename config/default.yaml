# 防火墙守护进程配置文件
# 默认配置：仅保护 sshd（SSH 服务）

# 全局默认值 - 应用于所有 jail，除非被覆盖
defaults:
  max_retries: 5
  findtime: 600
  ban_time: 900
  interval: 1
  metrics_port: 9119

# Jail 定义
jails:
  sshd:
    enabled: true
    log_files:
      - /var/log/auth.log
      - /var/log/secure
    max_retries: 5
    findtime: 600
    ban_time: 900
    regex: ""  # 空字符串使用内置的 sshd 模式

  frp:
    enabled: true
    log_files:
      - /var/log/frp/frp.log
    max_retries: 10
    findtime: 300
    ban_time: 1800
    regex: ""  # 空字符串使用内置默认

# 永久封禁配置（基于 SQLite 的持久化）
# 永久封禁的 SQLite 数据库文件路径（空 = 禁用）
# 使用具有适当权限的安全位置的绝对路径
# 可通过环境变量 FIREWALL_DB_PATH 覆盖
permanent_db_path: "/var/lib/firewall/bans.db"
# 是否启用永久封禁（true/false）
permanent_ban_enabled: true
