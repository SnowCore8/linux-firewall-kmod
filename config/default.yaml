# Firewall 守护进程默认配置
# 利用智能推断功能，只需配置 log_files 即可开箱即用

# ============================================================
# 全局默认值 - 应用于所有 jail，除非被覆盖
# ============================================================
defaults:
  max_retries: 3
  findtime: 600         # 10 分钟
  ban_time: 900         # 15 分钟
  interval: 1           # 检查间隔（秒）
  metrics_port: 9119    # Prometheus 指标端口
  metrics_bind_address: "0.0.0.0"  # 监听地址（0.0.0.0 = 所有接口，支持局域网访问；127.0.0.1 = 仅本地）
  # 非回环绑定必须配认证，否则 daemon 拒绝启动 HTTP 服务（http_exporter/lifecycle.rs 有意为之）。
  # 凭据是明文，且本文件已被 git 跟踪 —— 不要提交本改动。
  metrics_username: "snow"
  metrics_password: "9420"
  # 守护进程独立日志文件（NULL/留空 = 仅 syslog）
  # 文档承诺的 /var/log/firewall.log 路径
  log_file: /var/log/firewall.log
  # 运行时日志级别: 0=NONE, 1=ERR, 2=WARN, 3=INFO(默认), 4=DEBUG
  log_level: 3

# ============================================================
# Jail 定义 - 每个服务独立监控
# ============================================================
jails:
  # SSH 服务防护（使用内置正则模式）
  sshd:
    enabled: true
    log_files:
      - /var/log/auth.log       # Debian/Ubuntu
      - /var/log/secure         # RHEL/CentOS
    max_retries: 2
    findtime: 600               # 10 分钟
    ban_time: -1                # 永久封禁
    # 命名正则表达式匹配：支持多种 SSH 攻击模式
    regexes:
      invalid_user:
        pattern: "Invalid user [a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
      failed_password:
        pattern: "Failed password for (?:invalid user )?[a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
      connection_closed:
        pattern: "Connection closed by invalid user [a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"

# Web UI 配置
# ============================================================
webui:
  sse_push_interval: 1        # SSE 推送间隔（秒）
  rate_warning_pps: 50000     # 速率警告阈值（包/秒）
  rate_critical_pps: 200000   # 速率严重告警阈值（包/秒）
  rate_warning_syn: 1000      # SYN 速率警告阈值（包/秒）
  rate_critical_syn: 5000     # SYN 速率严重告警阈值（包/秒）

# DDoS 防护配置
# ============================================================
ddos:
  enabled: true
  global_conn_rate: 100000    # 全局每秒最大连接数
  auto_ban_duration: 3600     # 自动封禁时长（秒）
  auto_ban_threshold: 3       # 超阈值几次后封禁
  check_interval: 5           # 检测间隔（秒）
  # 协议专项阈值（同步到内核模块，正常主机参考值）
  max_syn_per_second: 2000    # SYN flood 阈值
  max_udp_per_second: 10000   # UDP flood 阈值
  max_icmp_per_second: 500    # ICMP flood 阈值
  max_ack_per_second: 20000   # ACK flood 阈值
  max_rst_per_second: 2000    # RST flood 阈值
  max_fin_per_second: 2000    # FIN flood 阈值
  # DDoS 检测算法开关
  static_threshold: true      # 静态阈值检测（默认开启）
  dynamic_threshold: false    # 动态阈值检测（默认关闭，基线×倍数）
  ddos_detection: true        # DDoS 检测总开关（默认开启）
  # 内核模块参数
  max_bans_per_second: 200    # 每秒最大封禁添加次数（泛洪保护）
  max_rate_entries: 65536     # 速率表最大条目数（支持并发源 IP 数）
  # 对外监听端口自动纳入 DDoS 速率判定
  # 公网唯一能打到本机的地方就是对外监听端口，速率判定聚焦于此；未对外监听的
  # 端口不参与速率判定，避免内部流量误封。封禁表不受影响，jail 判定与手工下发
  # 的封禁对所有端口一律生效。
  # 关闭后下发全零位图（检测面为空，仅供排查/对照）；与「daemon 未运行」不同，
  # 后者内核按全端口受保护处理。
  protect_open_ports: true

# ============================================================
# 可信 IP 白名单
# 启动时自动加入内核白名单，防止误封
# 支持单 IP 和 CIDR 格式
# ============================================================
trusted_ips:
  # - 43.100.123.123          # FRP 服务器
  # - 10.0.0.0/8              # 内网网段

# ============================================================
# 容量配置（用户自定义上限，默认 65535）
# ============================================================
capacity:
  max_ban_entries: 65535         # 封禁表最大条目数
  max_whitelist_entries: 65535   # 白名单最大条目数
  max_rate_entries: 65535        # 速率表最大条目数
  max_local_ip_cache: 65535      # 本地 IP 缓存最大条目数

# ============================================================
# GeoIP 地理库（可选）
# ============================================================
# 攻击地图（3D 地球）需要城市级地理库来把 IP 解析成经纬度。
# 留空或文件不存在时地理分布功能整体禁用，不影响其他功能。
# 下载：bash scripts/fetch-geoip.sh
# 注意：必须是 City 级库（含经纬度）。mihomo 自带的 Country.mmdb 只有国家代码，
#       没有经纬度，不能用于地图打点。
# 许可：DB-IP City Lite 采用 CC BY 4.0，使用时必须署名 https://db-ip.com
# geoip_db_path: /var/lib/firewall/geoip/city.mmdb

# ============================================================
# 本机（服务器）经纬度（可选）
# ============================================================
# 攻击地图用它标出「本机」位置，并从每个攻击源画一条弧线连到本机。
# 两个值必须成对给出：只写一个会拒绝加载（半份坐标会画到错误的位置上）。
# 都不填（或留空）＝不画该标记与弧线，而不是退回到某个占位坐标。
# 取值范围：纬度 -90 ~ 90，经度 -180 ~ 180。
# 优先级：这里填了就用这里（最权威）；没填才看下面的自动探测。
# server_latitude: 39.9042
# server_longitude: 116.4074

# ============================================================
# 自动探测本机坐标（可选，默认关闭）
# ============================================================
# 本机网卡上往往是云厂商内网地址，离线推不出公网出口 IP，故提供这条探测路径：
# 守护进程启动时向下面的地址发一次 HTTPS 请求取回出口 IP，再用本地 GeoIP 库把它
# 解析成经纬度（与攻击源散点同一套库，不会出现两套库互相矛盾的坐标）。
#
# 发往哪里：一个公网 IP 查询服务，默认 https://api.ip.sb/geoip；可用
#   geoip_egress_probe_url 换成别的地址（如 https://myip.ipip.net/json）。
# 默认开关：geoip_detect_egress 默认 false —— 默认关闭，不会发出任何对外请求。
# 如何开启：把下面这行取消注释改成 true。开启后启动日志里会有一行中文记录
#   「已向 <地址> 探测出口 IP」，可在日志中核对实际请求目标。
# 如何关闭：保持注释（或写 false）即可；填了上面的 server_latitude/server_longitude
#   也不会发探测请求（配置优先）。
# 探测只在启动时进行一次，结果缓存在内存；失败只记日志，不影响启动与封禁功能。
# geoip_detect_egress: false
# geoip_egress_probe_url: https://api.ip.sb/geoip
