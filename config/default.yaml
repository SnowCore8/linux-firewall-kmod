# Firewall 守护进程默认配置
# 利用智能推断功能，只需配置 log_files 即可开箱即用

# ============================================================
# 全局默认值 - 应用于所有 jail，除非被覆盖
# ============================================================
defaults:
  max_retries: 5
  findtime: 600         # 10 分钟
  ban_time: 900         # 15 分钟
  interval: 1           # 检查间隔（秒）
  metrics_port: 9119    # Prometheus 指标端口

# ============================================================
# Jail 定义 - 每个服务独立监控
# ============================================================
jails:
  # SSH 服务防护（使用内置正则模式）
  sshd:
    enabled: true
    log_files:
      - /var/log/auth.log       # Debian/Ubuntu
      - /var/log/secure         # RHEL/CentOS
    # 智能推断：max_retries=5, findtime=600, ban_time=900
    regex: ""                   # 空字符串 = 使用内置 sshd 模式

# ============================================================
# 永久封禁配置（SQLite 持久化）
# ============================================================
permanent_db_path: "/var/lib/firewall/bans.db"
permanent_ban_enabled: true
