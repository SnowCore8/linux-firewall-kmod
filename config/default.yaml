# Firewall 守护进程默认配置
# 利用智能推断功能，只需配置 log_files 即可开箱即用

# ============================================================
# 全局默认值 - 应用于所有 jail，除非被覆盖
# ============================================================
defaults:
  max_retries: 3
  findtime: 600         # 10 分钟
  ban_time: 900         # 15 分钟
  interval: 1           # 检查间隔（秒）
  metrics_port: 9119    # Prometheus 指标端口
  metrics_bind_address: "0.0.0.0"  # 监听地址（0.0.0.0 = 所有接口，支持局域网访问；127.0.0.1 = 仅本地）
  # 守护进程独立日志文件（NULL/留空 = 仅 syslog）
  # 文档承诺的 /var/log/firewall.log 路径
  log_file: /var/log/firewall.log
  # 运行时日志级别: 0=NONE, 1=ERR, 2=WARN, 3=INFO(默认), 4=DEBUG
  log_level: 3

# ============================================================
# Jail 定义 - 每个服务独立监控
# ============================================================
jails:
  # SSH 服务防护（使用内置正则模式）
  sshd:
    enabled: true
    log_files:
      - /var/log/auth.log       # Debian/Ubuntu
      - /var/log/secure         # RHEL/CentOS
    max_retries: 2
    findtime: 600               # 10 分钟
    ban_time: -1                # 永久封禁
    # 命名正则表达式匹配：支持多种 SSH 攻击模式
    regexes:
      invalid_user:
        pattern: "Invalid user [a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
      failed_password:
        pattern: "Failed password for (?:invalid user )?[a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
      connection_closed:
        pattern: "Connection closed by invalid user [a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"

# Web UI 配置
# ============================================================
webui:
  sse_push_interval: 1        # SSE 推送间隔（秒）
  rate_warning_pps: 50000     # 速率警告阈值（包/秒）
  rate_critical_pps: 200000   # 速率严重告警阈值（包/秒）
  rate_warning_syn: 1000      # SYN 速率警告阈值（包/秒）
  rate_critical_syn: 5000     # SYN 速率严重告警阈值（包/秒）

# DDoS 防护配置
# ============================================================
ddos:
  enabled: true
  per_ip_conn_rate: 500       # 单 IP 每秒最大连接数
  per_ip_fail_rate: 200       # 单 IP 每分钟最大失败次数
  global_conn_rate: 100000    # 全局每秒最大连接数
  auto_ban_duration: 3600     # 自动封禁时长（秒）
  auto_ban_threshold: 3       # 超阈值几次后封禁
  check_interval: 5           # 检测间隔（秒）
  # 协议专项阈值（同步到内核模块，正常主机参考值）
  max_syn_per_second: 2000    # SYN flood 阈值
  max_udp_per_second: 10000   # UDP flood 阈值
  max_icmp_per_second: 500    # ICMP flood 阈值
  max_ack_per_second: 20000   # ACK flood 阈值
  max_rst_per_second: 2000    # RST flood 阈值
  max_fin_per_second: 2000    # FIN flood 阈值
  # DDoS 检测算法开关
  static_threshold: true      # 静态阈值检测（默认开启）
  dynamic_threshold: false    # 动态阈值检测（默认关闭，基线×倍数）
  ddos_detection: true        # DDoS 检测总开关（默认开启）
  # 内核模块参数
  max_bans_per_second: 200    # 每秒最大封禁添加次数（泛洪保护）
  max_rate_entries: 65536     # 速率表最大条目数（支持并发源 IP 数）

# ============================================================
# 可信 IP 白名单
# 启动时自动加入内核白名单，防止误封
# 支持单 IP 和 CIDR 格式
# ============================================================
trusted_ips:
  # - 43.100.123.123          # FRP 服务器
  # - 8.140.211.27            # 另一台服务器
  # - 10.0.0.0/8              # 内网网段

# ============================================================
# 容量配置（用户自定义上限，默认 65535）
# ============================================================
capacity:
  max_ban_entries: 65535         # 封禁表最大条目数
  max_whitelist_entries: 65535   # 白名单最大条目数
  max_rate_entries: 65535        # 速率表最大条目数
  max_local_ip_cache: 65535      # 本地 IP 缓存最大条目数
