defaults:
  max_retries: 3
  findtime: 600
  ban_time: 900
  interval: 1
  metrics_port: 9119
  metrics_bind_address: "127.0.0.1"
  log_file: /tmp/fw-test-logs/firewall.log
  log_level: 3

jails:
  sshd:
    enabled: true
    log_files:
      - /tmp/fw-test-logs/auth.log
    max_retries: 2
    findtime: 600
    ban_time: 900
    regexes:
      failed_password:
        pattern: "Failed password for (?:invalid user )?[a-zA-Z0-9_.-]{1,64} from ([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
