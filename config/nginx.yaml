# Nginx 防护配置
# 监控 Nginx 错误日志，防护恶意扫描和攻击

jails:
  nginx:
    enabled: true
    log_files:
      - /var/log/nginx/error.log
    # 智能推断参数：max_retries=10, findtime=300, ban_time=1800
    # 匹配 Nginx 访问禁止规则的日志
    regexes:
      access_forbidden:
        pattern: 'access forbidden by rule, client: ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)'
