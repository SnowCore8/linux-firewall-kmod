# Firewall kernel module parameters
# Install to: /etc/modprobe.d/firewall.conf
# These parameters are applied when the module is loaded (boot or manual).

# Ban duration in seconds (default: 600 = 10 minutes)
options firewall fw_ban_time=600

# Maximum retries before ban (default: 3)
options firewall fw_max_retries=3

# Time window for counting failures in seconds (default: 600 = 10 minutes)
options firewall fw_findtime=600

# State file path for persistence (optional, default: /var/lib/firewall/state)
# options firewall state_file=/var/lib/firewall/state
