name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # 编译任务：依赖代码质量检查，确保代码风格通过后再编译
  build:
    name: 编译
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) \
            libyaml-dev libsqlite3-dev libmicrohttpd-dev libpcre2-dev

      - name: 完整编译（内核模块 + 守护进程）
        run: make

      - name: 验证编译产物
        run: |
          echo "=== 验证内核模块 ==="
          if [[ -f build/kernel-module/firewall.ko ]]; then
            echo "✓ 内核模块编译成功"
            file build/kernel-module/firewall.ko
          else
            echo "✗ 内核模块编译失败"
            exit 1
          fi

          echo "=== 验证守护进程 ==="
          if [[ -f build/daemon/firewall-daemon ]]; then
            echo "✓ 守护进程编译成功"
            file build/daemon/firewall-daemon
            ldd build/daemon/firewall-daemon
          else
            echo "✗ 守护进程编译失败"
            exit 1
          fi

  # 测试任务：依赖编译任务，确保编译成功后再运行测试
  test:
    name: 运行测试
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) \
            libyaml-dev libsqlite3-dev libmicrohttpd-dev libpcre2-dev

      - name: 执行测试并生成报告
        run: sudo ./tests/run_tests.sh --report

  # 代码质量任务：最先执行，包含代码风格检查、YAML 配置检查和编译警告检查
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装检查工具
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install yamllint

      - name: 检查代码风格（clang-format）
        run: |
          echo "检查内核模块代码..."
          clang-format --dry-run --Werror src/kernel-module/*.c src/kernel-module/*.h
          echo "检查守护进程代码..."
          clang-format --dry-run --Werror src/daemon/*.c src/daemon/*.h

      - name: 检查 YAML 配置（yamllint）
        run: yamllint -c .yamllint config/*.yaml

      - name: 安装编译依赖
        run: |
          sudo apt-get install -y build-essential linux-headers-$(uname -r) \
            libyaml-dev libsqlite3-dev libmicrohttpd-dev libpcre2-dev

      - name: 编译警告检查（-Werror）
        run: make SECURITY_CFLAGS="-Wall -Wextra -Werror -O2 -D_FORTIFY_SOURCE=2 -fstack-protector-strong -fPIE"
