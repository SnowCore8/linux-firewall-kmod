name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # 代码质量任务：最先执行，仅包含静态检查（代码风格 + YAML 配置）
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装检查工具
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install yamllint

      - name: 检查代码风格（clang-format）
        run: |
          echo "检查内核模块代码..."
          clang-format --dry-run --Werror src/kernel-module/*.c src/kernel-module/*.h
          echo "检查守护进程代码..."
          clang-format --dry-run --Werror src/daemon/*.c src/daemon/*.h

      - name: 检查 YAML 配置（yamllint）
        run: yamllint -c .yamllint config/*.yaml

  # 编译任务：独立执行，与 lint 并行运行
  build:
    name: 编译
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          # 优先尝试安装当前运行内核的头文件（Azure VM 可能不匹配），
          # 失败时回退到 linux-headers-generic（保证始终有可用头文件）
          sudo apt-get install -y build-essential \
            linux-headers-"$(uname -r)" 2>/dev/null || \
          sudo apt-get install -y linux-headers-generic
          sudo apt-get install -y libyaml-dev libsqlite3-dev libmicrohttpd-dev libpcre2-dev

      - name: 验证内核头文件匹配运行内核
        continue-on-error: true
        run: |
          # 内核模块编译必须使用与运行内核匹配的头文件
          if [[ -d "/lib/modules/$(uname -r)/build" ]]; then
            echo "✓ 内核头文件匹配运行内核: $(uname -r)"
          else
            echo "⚠ 运行内核 $(uname -r) 的头文件不可用"
            echo "  GitHub Actions Azure VM 使用自定义内核，其头文件不在标准 apt 源中。"
            echo "  当前可用的内核头文件目录："
            find /lib/modules -maxdepth 2 -name build -type d 2>/dev/null || echo "  （无）"
            echo "  将使用通用内核头文件继续编译（产出的内核模块可能与运行内核不兼容）"
          fi

      - name: 检测可用内核构建目录
        id: kdir
        run: |
          # 优先使用运行内核的构建目录
          RUNNING_KDIR="/lib/modules/$(uname -r)/build"
          if [[ -d "$RUNNING_KDIR" ]]; then
            echo "KDIR=$RUNNING_KDIR" >> "$GITHUB_OUTPUT"
            echo "✓ 使用运行内核的构建目录: $RUNNING_KDIR"
          else
            # 回退：寻找第一个可用的内核构建目录
            ALT_KDIR=$(find /lib/modules -maxdepth 2 -name build -type d 2>/dev/null | head -n1)
            if [[ -n "$ALT_KDIR" ]]; then
              REAL_KDIR=$(readlink -f "$ALT_KDIR")
              echo "KDIR=$REAL_KDIR" >> "$GITHUB_OUTPUT"
              echo "⚠ 运行内核头文件不可用，使用回退构建目录:"
              echo "  运行内核: $(uname -r)"
              echo "  可用目录: $ALT_KDIR -> $REAL_KDIR"
              echo "  注意: 编译的内核模块可能无法在当前内核上加载"
            else
              echo "KDIR=" >> "$GITHUB_OUTPUT"
              echo "::error::未找到任何可用的内核构建目录，内核模块将跳过编译"
            fi
          fi

      - name: 编译守护进程
        run: |
          set -x
          echo "=== 步骤 1: 编译守护进程 ==="
          make daemon -j$(nproc)
          echo "✓ 守护进程编译完成"

      - name: 编译内核模块
        continue-on-error: true
        id: kernel-module-build
        run: |
          set -x
          if [[ -n "${{ steps.kdir.outputs.KDIR }}" ]]; then
            echo "=== 步骤 2: 编译内核模块 ==="
            echo "使用 KDIR=${{ steps.kdir.outputs.KDIR }}"
            echo "内核版本: $(ls $(echo ${{ steps.kdir.outputs.KDIR }} | head -c 20)/.. 2>/dev/null | head -1 || echo '未知')"
            make kernel-module KDIR=${{ steps.kdir.outputs.KDIR }}
            echo "✓ 内核模块编译完成"
          else
            echo "⚠ 内核头文件不可用，跳过内核模块编译"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译结果总结
        run: |
          echo "=== 编译结果总结 ==="
          if [[ "${{ steps.kernel-module-build.outcome }}" == "success" ]]; then
            echo "✓ 内核模块: 编译成功"
          elif [[ "${{ steps.kernel-module-build.outputs.skip }}" == "true" ]]; then
            echo "⚠ 内核模块: 跳过（内核头文件不可用）"
          else
            echo "⚠ 内核模块: 编译失败（不影响 CI 继续）"
            echo "可能的原因:"
            echo "  1. 内核头文件版本与代码不兼容"
            echo "  2. 编译器版本差异"
            echo "  3. 内核 API 变更"
            echo "建议: 检查内核模块编译日志中的具体错误信息"
          fi
          if [[ -f build/daemon/firewall-daemon ]]; then
            echo "✓ 守护进程: 编译成功"
          else
            echo "✗ 守护进程: 编译失败"
            exit 1
          fi

      - name: 验证编译产物
        run: |
          echo "=== 验证内核模块 ==="
          if [[ -f build/kernel-module/firewall.ko ]]; then
            echo "✓ 内核模块编译成功"
            file build/kernel-module/firewall.ko
          else
            echo "⚠ 内核模块未编译（内核头文件不可用）"
          fi

          echo "=== 验证守护进程 ==="
          if [[ -f build/daemon/firewall-daemon ]]; then
            echo "✓ 守护进程编译成功"
            file build/daemon/firewall-daemon
            ldd build/daemon/firewall-daemon
          else
            echo "✗ 守护进程编译失败"
            exit 1
          fi

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 1
          if-no-files-found: warn

  # 测试任务：依赖编译任务，使用 build 的编译产物
  test:
    name: 运行测试
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 跳过测试脚本内部的重新编译步骤，使用 build 任务的产物
      SKIP_COMPILE: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: 设置执行权限
        run: chmod +x build/daemon/firewall-daemon

      - name: 安装运行时依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-0-2 libsqlite3-0 libmicrohttpd12 libpcre2-8-0

      - name: 执行测试并生成报告
        run: sudo -E ./tests/run_tests.sh --report
