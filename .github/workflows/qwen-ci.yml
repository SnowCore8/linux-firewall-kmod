name: '🧪 测试'

# `.github/scripts` 里放的是判断逻辑：谁该接手、谁该被叫醒、能不能合。这些错了不会
# 报错，只会安静地做错事 —— 判据写歪，闸门就会放行不该放的 PR。所以它们全都配了
# 测试，README 也写着「改完跑这几条」。
#
# 只在本机跑等于没跑：合并闸门的 checks 判据查的是 PR 上的检查项，而 CI 里只有
# 调度工作流的「分派」一个 pass —— 测试改坏了、断言删掉了，闸门看到的仍然是绿的。
# 最可信的那层判断，恰好没有被执行。
#
# 这份工作流补的就是这一环。它必须是**独立 workflow**：merge-gate.mjs 的
# withoutOwnRun() 会剔掉「本次运行自己产生的检查项」，塞进 qwen-miles.yml 的 job
# 会被当成自检剔除，等于没加。
#
# 不加 paths 过滤：markdown 改动也跑一遍，几十秒。按路径跳过会让「没跑」显示成
# SKIPPED，而 merge-gate 的 checkState() 把 SKIPPED 判为 SUCCESS —— 跳过的成本比跑完高。
on:
  pull_request:
    # synchronize 不可省：dispatch 只在 opened / ready_for_review 触发，
    # 而陈实每推一次修都要重新验一遍，否则闸门看的是旧提交上的绿
    types: ['opened', 'synchronize', 'reopened', 'ready_for_review']
  push:
    # 人自己推的会跑，红了一眼能看到。代理合并走 App 安装令牌，push 不会触发这里
    # （GitHub 防递归），所以主干红了没有谁会被告知 —— 这里不再假装能兜住。
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: 'read'

# 同一张 PR 连续推几次，只跑最后一次。取消了也算不通过之前的那次运行，
# 不会让闸门拿着旧结果放行。
concurrency:
  group: 'qwen-ci-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: '测试'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - name: '检出仓库'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5

      - name: '准备 Node'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 唯一的开发依赖是 markdown-it（文档自查靠它解析）。判断逻辑本身不用它，
      # 但 docs-check 的用例跟其余测试一起跑，所以这一步必须排在测试前面。
      - name: '安装开发依赖'
        run: |-
          set -euo pipefail
          npm ci --no-audit --no-fund

      # 判断逻辑的测试：路由、巡检、合并闸门、评审语义、gh 包装器
      - name: '跑判断逻辑的测试'
        run: |-
          set -euo pipefail
          node --test .github/scripts/*.test.mjs

      # 四个人的这一轮都是工作流脚本（.qwen/workflows/*.js）。写坏了只会在下一轮
      # 真跑起来时才炸 —— 写坏的时候模型还没有上下文，报错在 runner 里，本地看不出来。
      # `node --check` 足够：工作流脚本的顶层 `return` 是它的返回值，被当成模块加载，
      # 所以不需要额外包装（实测：删掉一个分号返回 1，顶层 return 返回 0）。
      - name: '检查工作流脚本能否解析'
        run: |-
          set -euo pipefail
          for f in .qwen/workflows/*.js; do
            node --check "${f}"
            echo "${f} OK"
          done

      # 判断逻辑脚本（.github/scripts/*.mjs）：部分脚本没有对应的 .test.mjs（如 gh.mjs、
      # setup-app.mjs），语法错误只能靠 node --check 兜底。跟工作流脚本同理，写坏了
      # 只在下一轮跑起来时才炸，本地不容易发现。
      - name: '检查判断逻辑脚本能否解析'
        run: |-
          set -euo pipefail
          for f in .github/scripts/*.mjs; do
            node --check "${f}"
            echo "${f} OK"
          done

      # 四个人的引擎配置是 JSON，由 run-agent 读进来交给引擎。写坏了同样只在
      # 下一轮才炸，而且报错在 runner 里、本地看不出来。
      - name: '检查引擎配置能否解析'
        run: |-
          set -euo pipefail
          python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('.github/agents/*.json')]"
          echo 'JSON OK'

      # 文档规范（docs/style.md）：标题只一个、不跳级、代码块标语言、表格列数对得上、
      # 内部链接指得到。规范靠评审会漂，靠这一步才不漂。
      - name: '检查文档'
        run: |-
          set -euo pipefail
          node .github/scripts/docs-check.mjs
