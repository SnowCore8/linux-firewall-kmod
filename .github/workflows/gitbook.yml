name: Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/gitbook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install GitBook CLI
        run: npm install -g gitbook-cli

      - name: Build Chinese docs
        run: |
          cd docs
          cp book.json zh/book.json
          gitbook build zh _book/zh

      - name: Build English docs
        run: |
          cd docs
          cp book.json en/book.json
          gitbook build en _book/en

      - name: Create index redirect
        run: |
          mkdir -p docs/_book
          cat > docs/_book/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0;url=zh/"></head>
          <body><p>Redirecting to <a href="zh/">Chinese docs</a> or <a href="en/">English docs</a></p></body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_book/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
