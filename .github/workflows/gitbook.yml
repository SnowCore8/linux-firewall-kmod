name: Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/gitbook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install HonKit and plugins
        working-directory: docs
        run: npm ci --no-audit --no-fund

      - name: Build multilingual site
        working-directory: docs
        run: npx honkit build . _book

      - name: Strip build artifacts
        working-directory: docs/_book
        run: |
          rm -f package.json package-lock.json
          # Each language's pages fetch <lang>/search_index.json (relative
          # to basePath). The root copy is unused; drop it to save 1MB.
          rm -f search_index.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_book/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
