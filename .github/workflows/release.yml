name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read

jobs:
  # 发布前先证明被 tag 的那次提交确实过了必需检查。tag 可以由管理员直接推，
  # 但发布物不能因此绕过门禁。
  verify:
    name: 校验必需检查
    runs-on: ubuntu-26.04
    steps:
      - name: 必需检查必须全部成功
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          fail=0
          for name in 代码质量检查 前端构建 编译 运行测试 浏览器端到端测试; do
            conclusion="$(printf '%s' "$runs" | jq -r --arg n "$name"               '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // "missing"')"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::必需检查「$name」在 ${GITHUB_SHA} 上的最新结果是 $conclusion"
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::被 tag 的提交没有通过全部门禁，拒绝发布"
            exit 1
          fi
          echo "✓ 五项必需检查均为 success"

  build-and-release:
    name: 构建并发布
    needs: [verify]
    runs-on: ubuntu-26.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装依赖
        run: |
          sudo apt-get update
          # 打包走 debhelper + dpkg-buildpackage；内核模块由 DKMS 在安装时编译，
          # 构建机不需要内核头文件。nodejs/npm/python3 是 debian/control 的
          # Build-Depends，dpkg-checkbuilddeps 会强制校验。
          sudo apt-get install -y build-essential dpkg-dev debhelper nodejs npm python3

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 构建 deb 包
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh "$VERSION"

      - name: 汇总发布资产
        run: |
          set -euo pipefail
          cp LICENSE LICENSE.GPL-2.0 THIRD-PARTY-NOTICES.md build/deb/
          (cd build/deb && sha256sum linux-firewall-kmod-*.deb > SHA256SUMS)

      - name: 生成 SBOM（SPDX JSON）
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: build/deb
          format: spdx-json
          output-file: build/deb/sbom.spdx.json
          upload-artifact: false

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/deb/linux-firewall-kmod-*.deb
            build/deb/SHA256SUMS
            build/deb/sbom.spdx.json
            build/deb/LICENSE
            build/deb/LICENSE.GPL-2.0
            build/deb/THIRD-PARTY-NOTICES.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
