name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布
    runs-on: ubuntu-26.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装依赖
        run: |
          sudo apt-get update
          # 打包走 debhelper + dpkg-buildpackage；内核模块由 DKMS 在安装时编译，
          # 构建机不需要内核头文件。nodejs/npm/python3 是 debian/control 的
          # Build-Depends，dpkg-checkbuilddeps 会强制校验。
          sudo apt-get install -y build-essential dpkg-dev debhelper nodejs npm python3

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 构建 deb 包
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh "$VERSION"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/deb/linux-firewall-kmod-*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
