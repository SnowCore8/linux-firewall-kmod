name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          # 守护进程为纯 Go 构建（前端经 npm/vite），打包只需 build-essential 与 dpkg-dev；
          # 内核模块由 DKMS 在安装时编译，此处 SKIP_KERNEL_BUILD。
          sudo apt-get install -y build-essential dpkg-dev

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 构建 deb 包
        env:
          SKIP_KERNEL_BUILD: "1"
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh ${{ steps.version.outputs.VERSION }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/deb/linux-firewall-kmod-*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
