name: '🔧 Qwen Miles'

# 陈实，研发工程师：认领任务、写代码、响应评审、合并。像作者一样对自己的改动负责。
on:
  workflow_call:
    inputs:
      number:
        type: 'string'
        description: 'Issue 或 PR 编号'
        required: true
      on_pr:
        type: 'string'
        description: "'true' 表示处理对象是 PR"
        required: false
        default: 'false'
      issue_number:
        type: 'string'
        description: '关联 Issue 编号（PR 场景）'
        required: false
        default: ''
      pr_number:
        type: 'string'
        description: 'PR 编号'
        required: false
        default: ''
      head_ref:
        type: 'string'
        description: 'PR 分支名'
        required: false
        default: ''
      reason:
        type: 'string'
        description: '为什么叫陈实来'
        required: false
        default: '手动触发'
    outputs:
      mode:
        description: '本次执行的模式'
        value: '${{ jobs.work.outputs.mode }}'
      pushed:
        description: "'true' 表示本次有新提交被推送到分支"
        value: '${{ jobs.work.outputs.pushed }}'

concurrency:
  group: '${{ github.workflow }}-miles-${{ inputs.number }}'
  # 默认的 queue: single 只留一个排队位，新来的会把排着的那次取消掉——被取消的运行
  # jobs 为空，等于这次叫醒被静默丢弃。追加的评审意见不能被丢掉，得排着。
  queue: max
  # 同一对象的两次修复会互相踩，必须串行；已开始的工作不能被中断
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  work:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    outputs:
      mode: '${{ steps.context.outputs.mode }}'
      pushed: '${{ steps.detect.outputs.pushed }}'
    permissions:
      # 闸门要读检查项：statusCheckRollup 除了 checks 还会展开 checkSuite.workflowRun，
      # 老式状态上下文另走 statuses —— 少一档 gh 就报 Resource not accessible by integration。
      # App 令牌没有这三档，所以闸门那一步用这个令牌。
      actions: 'read'
      checks: 'read'
      contents: 'write'
      statuses: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID_MILES || vars.APP_ID_ENGINEER || vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID_MILES || vars.APP_ID_ENGINEER || vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY_MILES || secrets.APP_PRIVATE_KEY_ENGINEER || secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'
          # 改 .github/workflows/ 必须带这个权限，否则推送会被 GitHub 拒绝
          permission-workflows: 'write'

      - name: 'Work out the mode and branch'
        id: 'context'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          NUMBER: '${{ inputs.number }}'
          ON_PR: '${{ inputs.on_pr }}'
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          PR_NUMBER: '${{ inputs.pr_number }}'
          HEAD_REF_INPUT: '${{ inputs.head_ref }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const { owner, repo } = context.repo;
            const number = Number(process.env.NUMBER);
            const onPr = process.env.ON_PR === 'true';

            let mode = 'fix-issue';
            let issueNumber = process.env.ISSUE_NUMBER || '';
            let prNumber = process.env.PR_NUMBER || '';
            let headRef = process.env.HEAD_REF_INPUT || '';
            let baseBranch = '';

            if (onPr) {
              mode = 'respond-pr';
              prNumber = String(number);
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              headRef = pull.head.ref;
              baseBranch = pull.base.ref;

              // 只碰自己开的分支，别人的 PR 一律不动
              if (!headRef.startsWith('qwen-fix-')) {
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `分支 ${headRef} 不是我方创建的，不修改他人的 PR`);
                core.setOutput('mode', mode);
                return;
              }

              if (!issueNumber) {
                issueNumber = headRef.replace('qwen-fix-', '');
              }

              // 已合并或已关闭就别再动
              if (pull.state !== 'open') {
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', '该 PR 已关闭或已合并');
                core.setOutput('mode', mode);
                return;
              }
            } else {
              issueNumber = String(number);
              headRef = `qwen-fix-${issueNumber}`;
              baseBranch = context.payload.repository?.default_branch || 'master';
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: number,
              });
              if (issue.state !== 'open') {
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', '该 Issue 已关闭');
                core.setOutput('mode', mode);
                return;
              }
            }

            core.setOutput('skip', 'false');
            core.setOutput('mode', mode);
            core.setOutput('issue_number', issueNumber);
            core.setOutput('pr_number', prNumber);
            core.setOutput('head_ref', headRef);
            core.setOutput('base_branch', baseBranch);
            core.setOutput('previous_head', mode === 'respond-pr' ? headRef : '');
            core.info(`模式 ${mode}，分支 ${headRef} → ${baseBranch}，Issue #${issueNumber}，PR #${prNumber}`);

      - name: 'Explain why Miles is not touching this'
        if: |-
          ${{ steps.context.outputs.skip == 'true' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          NUMBER: '${{ inputs.number }}'
          REPOSITORY: '${{ github.repository }}'
          SKIP_REASON: '${{ steps.context.outputs.skip_reason }}'
        run: |-
          gh issue comment "${NUMBER}" \
            --repo "${REPOSITORY}" \
            --body "这条我不动手：${SKIP_REASON}

          需要我处理的话直接说一声。

          <!-- qwen:role=miles -->"

      - name: 'Checkout repository'
        if: |-
          ${{ steps.context.outputs.skip != 'true' }}
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN }}'

      - name: 'Checkout existing branch when responding'
        if: |-
          ${{ steps.context.outputs.skip != 'true' && steps.context.outputs.mode == 'respond-pr' }}
        env:
          HEAD_REF: '${{ steps.context.outputs.head_ref }}'
        run: |-
          set -euo pipefail
          git fetch origin "${HEAD_REF}"
          git checkout "${HEAD_REF}"
          git pull --ff-only origin "${HEAD_REF}"

      - name: 'Record the remote head before work'
        if: |-
          ${{ steps.context.outputs.skip != 'true' }}
        id: 'before'
        env:
          HEAD_REF: '${{ steps.context.outputs.head_ref }}'
        run: |-
          set -euo pipefail
          # 统一按远端分支判断，避免把「未推送」误判成「有新提交」
          echo "sha=$(git ls-remote --heads origin "${HEAD_REF}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          # 这一轮的起点。识别合并申请时，用它区分「这一轮新发的评论」和上一轮留下的
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # 合并前条件原写在 auto-miles.toml 里由陈实自己读、自己执行 `gh pr merge`，
      # 实测两次都没对上（PR #38 在 e2e 判失败后合并，PR #39 在批准挂在旧提交时合并）。
      # 所以合并不再经过模型：它只能写 <!-- qwen:merge-request -->，由下面的闸门执行。
      #
      # 这一步按 PATH 把 gh 包一层，拒掉合并入口。它不是安全边界 —— 令牌就在环境里，
      # 绕道 curl 照样能合；真正的保底是 job 末尾那道检查。这一步只是让「顺手合了」
      # 当场失败，而不是事后才发现。
      - name: 'Put merging out of the model reach'
        if: |-
          ${{ steps.context.outputs.skip != 'true' }}
        env:
          WRAPPER: '${{ github.workspace }}/.github/scripts/no-merge-gh'
        run: |-
          set -euo pipefail

          SHIM_DIR="${RUNNER_TEMP}/qwen-no-merge"
          REAL_GH="$(command -v gh)"

          rm -rf "${SHIM_DIR}"
          mkdir -p "${SHIM_DIR}"
          # 复制而不是引用工作区里那份：模型这一轮有写权限，改掉源文件就等于给自己
          # 开了一道门。副本在 RUNNER_TEMP 下，它够不着。
          cp "${WRAPPER}" "${SHIM_DIR}/no-merge-gh"
          chmod +x "${SHIM_DIR}/no-merge-gh"
          {
            echo '#!/usr/bin/env bash'
            echo "export REAL_GH='${REAL_GH}'"
            echo "exec '${SHIM_DIR}/no-merge-gh' \"\$@\""
          } > "${SHIM_DIR}/gh"
          chmod +x "${SHIM_DIR}/gh"

          # 装到 PATH 之前先自己验一遍：放行一条、拦下一条。验不过就不装，
          # 退化成「事后检查」而不是把模型手里的 gh 弄坏。
          if ! PATH="${SHIM_DIR}:${PATH}" gh --version >/dev/null 2>&1; then
            echo '::warning title=合并拦截层没装上::gh 包装器透传失败，本次只有事后检查兜底。'
            exit 0
          fi
          # 只认我们自己的拒绝文案：pr merge 0 在真 gh 上也必然失败，
          # 只看退出码会把「没拦住」误判成「拦住了」。
          # 不用 grep -q 接管道：pipefail 下 grep 提前退出会让左侧吃 SIGPIPE 而误判。
          REFUSED="$(PATH="${SHIM_DIR}:${PATH}" gh pr merge 0 --repo a/b 2>&1 || true)"
          case "${REFUSED}" in
            *'没有合并权限'*) ;;
            *)
              echo '::warning title=合并拦截层没装上::包装器没能拦下 gh pr merge，本次只有事后检查兜底。'
              exit 0
              ;;
          esac

          echo "${SHIM_DIR}" >> "${GITHUB_PATH}"
          echo "合并入口已接管：${SHIM_DIR}/gh"

      - name: 'Run Qwen miles'
        id: 'qwen_miles'
        if: |-
          ${{ steps.context.outputs.skip != 'true' }}
        uses: 'QwenLM/qwen-code-action@v1'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN }}'
          REPOSITORY: '${{ github.repository }}'
          NUMBER: '${{ inputs.number }}'
          ON_PR: '${{ inputs.on_pr }}'
          MODE: '${{ steps.context.outputs.mode }}'
          ISSUE_NUMBER: '${{ steps.context.outputs.issue_number }}'
          PR_NUMBER: '${{ steps.context.outputs.pr_number }}'
          HEAD_REF: '${{ steps.context.outputs.head_ref }}'
          BASE_BRANCH: '${{ steps.context.outputs.base_branch }}'
          OWNED_BRANCH_PREFIX: 'qwen-fix-'
          REASON: '${{ inputs.reason }}'
          CI_WAIT_MINUTES: '${{ vars.MILES_CI_WAIT_MINUTES || vars.ENGINEER_CI_WAIT_MINUTES || 10 }}'
          # 删主分支前要 @ 到具体的人。默认取仓库所有者，可用变量覆盖成任意成员。
          OWNER_MENTION: '${{ vars.QWEN_OWNER_MENTION || format(''@{0}'', github.repository_owner) }}'
        with:
          openai_api_key: '${{ secrets.QWEN_API_KEY }}'
          openai_base_url: '${{ vars.QWEN_BASE_URL }}'
          openai_model: '${{ vars.QWEN_MODEL }}'
          qwen_cli_version: '${{ vars.QWEN_CLI_VERSION }}'
          qwen_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'qwen-miles'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 150
              },
              "memory": {
                "enableManagedAutoMemory": false,
                "enableManagedAutoDream": false
              },
              "telemetry": {
                "enabled": false
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "get_file_contents",
                    "search_code",
                    "list_commits"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(git)",
                  "run_shell_command(gh)",
                  "run_shell_command(ls)",
                  "run_shell_command(cat)",
                  "run_shell_command(grep)"
                ]
              }
            }
          prompt: '/auto-miles'

      # API 报错时 CLI 仍然退出 0，把错误文本当成最后一段 assistant 输出
      # （qwen-code#8920、#11217，两者的修复 PR 至今都还没合并）。所以判据只能是
      # 「最后一句长什么样」。官方 qwen-triage.yml:1379 记的那次事故就是这样：
      # 一次 268 字符的裸 [API Error: ...] 被当成成功，没人重试也没人告警。
      # 尾部匹配而不是 contains：真实回复正文里哪怕引了一句 API 错误，后面还会
      # 继续写下去，不该因此判失败。
      - name: 'Fail when the model API returned an error'
        if: |-
          ${{ steps.qwen_miles.outcome == 'success' }}
        run: |-
          set -euo pipefail

          if [ ! -f qwen-artifacts/stdout.log ]; then
            echo '::error title=没有 qwen 的输出::找不到 qwen-artifacts/stdout.log，无法判断这一轮做了什么。'
            exit 1
          fi

          # 与 action 自己解析 qwen_response 的口径一致：取最后一段 assistant 文本
          BODY="$(jq -r '[.[] | select(.type == "assistant")] | last | .message.content[]? | select(.type == "text") | .text' \
            qwen-artifacts/stdout.log 2>/dev/null || true)"

          for S in \
            'Possible quota limitations in place or slow response times detected. Please wait and try again later.' \
            'Please wait and try again later. To increase your limits, request a quota increase through AI Studio, or switch to another /auth method' \
            'Please wait and try again later. To increase your limits, request a quota increase through Vertex, or switch to another /auth method'; do
            BODY="${BODY%"$S"}"
          done
          BODY="${BODY%"${BODY##*[![:space:]]}"}"

          case "${BODY}" in
            *"[API Error: "*"]")
              # 正文来自外部接口，别让它里面的 :: 或 ##[ 被当成 workflow 命令
              EXCERPT="$(printf '%s' "${BODY:0:300}" | sed -e 's/::/;;/g' -e 's/##\[/##［/g')"
              echo '::error title=模型 API 返回了错误::这一轮没有完成，动作不可用。这是接口侧的问题，重跑即可。'
              printf '%s\n' "${EXCERPT}" >&2
              exit 1
              ;;
          esac

      # 模型只能写申请，合不合由脚本判。这一行标记就是申请：写在最终回复里，或写在这一轮
      # 的最后那条评论里，两处都认。
      - name: 'Detect the merge request from this round'
        id: 'merge_request'
        if: |-
          ${{ steps.context.outputs.skip != 'true' && steps.qwen_miles.outcome == 'success' && steps.context.outputs.mode == 'respond-pr' }}
        env:
          # 这一步要读 PR 评论，而 Actions 里的 gh 没有隐式凭据：缺了它 gh 直接报
          # 「set the GH_TOKEN environment variable」，取回为空，申请就被读成没有。
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN }}'
          REPOSITORY: '${{ github.repository }}'
          PR_NUMBER: '${{ steps.context.outputs.pr_number }}'
          STARTED_AT: '${{ steps.before.outputs.started_at }}'
        run: |-
          set -euo pipefail

          PATTERN='^[[:space:]]*<!-- qwen:merge-request -->[[:space:]]*$'
          REQUESTED=''

          # 先看这一轮最后一段说出来的话。注意不能取「最后一个 assistant 条目」：
          # 那一轮实际是发评论的工具调用，里面没有 text 块，取 last 会拿到空串。
          if [ -f qwen-artifacts/stdout.log ]; then
            REPLY="$(jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | last // ""' \
              qwen-artifacts/stdout.log 2>/dev/null || true)"
            if grep -Eq "${PATTERN}" <<< "${REPLY}"; then
              REQUESTED=final-reply
            fi
          fi

          # 没写在最后那段话里，就看这一轮新发的机器人评论 —— 陈实习惯把结论写成评论，
          # 那也算申请。免得把上一轮留下的、或者顺嘴引用出来的标记当成申请：标记必须
          # 单独占一行，且这条评论在这一轮里动过；真判断仍在闸门里，这里只决定要不要跑闸门。
          #
          # 不给 API 传 since：与其猜服务端怎么筛，不如整份取回、在 jq 里按 updated_at
          # 自己筛。另外失败绝不能静默 —— 前两次之所以查不出原因，是 `2>/dev/null || true`
          # 把 gh 的报错吞了（真原因就是上面那个缺 GITHUB_TOKEN）。所以这里取不到就重试
          # 三次，并且把 gh 的报错原样打出来。
          if [ -z "${REQUESTED}" ] && [ -n "${STARTED_AT:-}" ] && [ -n "${PR_NUMBER:-}" ]; then
            JQ_FILTER="[.[] | select(.user.type == \"Bot\") | select(.updated_at >= \"${STARTED_AT}\") | .body] | join(\"\n\n\")"
            ERRLOG="${RUNNER_TEMP}/merge-request-comments.err"
            COMMENTS=''
            for ATTEMPT in 1 2 3; do
              if ! COMMENTS="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                --jq "${JQ_FILTER}" 2>"${ERRLOG}")"; then
                echo "取评论失败（第 ${ATTEMPT} 次）：$(cat "${ERRLOG}")"
                COMMENTS=''
              fi
              if grep -Eq "${PATTERN}" <<< "${COMMENTS}"; then
                REQUESTED=comment
                break
              fi
              [ "${ATTEMPT}" = '3' ] || sleep 5
            done
          fi

          if [ -n "${REQUESTED}" ]; then
            echo 'requested=true' >> "${GITHUB_OUTPUT}"
            echo "陈实申请了合并（来自 ${REQUESTED}），交给闸门判定。"
          else
            echo 'requested=false' >> "${GITHUB_OUTPUT}"
            echo '这一轮没有申请合并。'
          fi

      - name: 'Merge only if the gate allows it'
        id: 'gate'
        if: |-
          ${{ steps.merge_request.outputs.requested == 'true' }}
        env:
          # 这里用工作流自己的令牌，不用 App 令牌：`gh pr view --json statusCheckRollup`
          # 和 base 分支的 check-runs 都要 checks: read，而陈实的 App 只给了
          # contents / issues / pull-requests / workflows —— 用它查会得到
          # 「Resource not accessible by integration」，判据一条都跑不了。
          # 工作流令牌的权限由下面 job 的 permissions 块声明，够用且不含多余授权。
          GITHUB_TOKEN: '${{ github.token }}'
          # 这一步就是闸门本身，要放行上面那层 gh 包装器
          QWEN_MERGE_GATE: '1'
          PR_NUMBER: '${{ steps.context.outputs.pr_number }}'
          REPOSITORY: '${{ github.repository }}'
          MILES_CI_WAIT_MINUTES: '${{ vars.MILES_CI_WAIT_MINUTES || vars.ENGINEER_CI_WAIT_MINUTES || 10 }}'
        run: |-
          set -euo pipefail

          set +e
          node .github/scripts/merge-gate.mjs "${PR_NUMBER}" --repo "${REPOSITORY}" --merge
          CODE=$?
          set -e

          case "${CODE}" in
            0) echo 'gate=merged' >> "${GITHUB_OUTPUT}" ;;
            # 1 是「条件没满足」，结论已经贴在 PR 上了，不是出错
            1)
              echo 'gate=blocked' >> "${GITHUB_OUTPUT}"
              echo '闸门拦下了这次合并，原因见 PR 上的评论。' >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo 'gate=error' >> "${GITHUB_OUTPUT}"
              echo "::error title=合并闸门自己出错了::退出码 ${CODE}，这次合并没有完成，判据本身也没跑完。"
              exit "${CODE}"
              ;;
          esac

      # 闸门的真保底在这里，不在上面那层包装器里：包装器只是拦 gh，绕道 curl 拦不住。
      # 所以这一轮结束后核一次 PR 状态 —— 被机器人合掉却没过闸门，整轮判失败。
      - name: 'Fail when the pull request was merged outside the gate'
        if: |-
          ${{ always() && steps.context.outputs.skip != 'true' && steps.context.outputs.pr_number != '' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN }}'
          PR_NUMBER: '${{ steps.context.outputs.pr_number }}'
          REPOSITORY: '${{ github.repository }}'
          GATE: '${{ steps.gate.outputs.gate }}'
        run: |-
          set -euo pipefail

          STATE="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state --jq '.state')"
          MERGED_BY="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json mergedBy --jq '.mergedBy.login // ""')"
          echo "PR #${PR_NUMBER} 状态 ${STATE}，合并者 ${MERGED_BY:-无}，闸门 ${GATE:-未运行}"

          if [ "${STATE}" != 'MERGED' ] || [ "${GATE}" = 'merged' ]; then
            exit 0
          fi

          # 人自己合的不管：合并条件该由人判断，这里只盯机器人。
          case "${MERGED_BY}" in
            *'[bot]')
              echo '::error title=PR 在闸门之外被合掉了::这一轮没有经过 merge-gate.mjs 就合并了 PR，合并条件未核。'
              exit 1
              ;;
            *)
              echo "PR 是由 ${MERGED_BY:-非机器人} 合并的，不归这一轮。"
              ;;
          esac

      - name: 'Detect whether a new commit was pushed'
        id: 'detect'
        if: |-
          ${{ steps.context.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          HEAD_REF: '${{ steps.context.outputs.head_ref }}'
          BEFORE_SHA: '${{ steps.before.outputs.sha }}'
          REPOSITORY: '${{ github.repository }}'
          MODE: '${{ steps.context.outputs.mode }}'
          PR_NUMBER: '${{ steps.context.outputs.pr_number }}'
        run: |-
          set -euo pipefail

          # 两种模式都以远端分支为准，空值表示分支此前不存在
          REMOTE_SHA="$(git ls-remote --heads origin "${HEAD_REF}" | awk '{print $1}')"

          if [ -n "${REMOTE_SHA}" ] && [ "${REMOTE_SHA}" != "${BEFORE_SHA}" ]; then
            echo "pushed=true" >> "${GITHUB_OUTPUT}"
            echo "分支 ${HEAD_REF} 有新提交：${BEFORE_SHA:0:8} -> ${REMOTE_SHA:0:8}"
          else
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            echo "本次没有新提交（远端 ${REMOTE_SHA:0:8}）"
          fi
