version: 2

# 依赖更新按生态分组：同一次升级只开一个 PR，避免抢同一个合并闸门。
# 安全修复仍会单独开 PR，并走与其他变更相同的检查。

updates:
  - package-ecosystem: 'gomod'
    directory: '/src/daemon'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:23'
      timezone: 'Etc/UTC'
    groups:
      go:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 3

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:23'
      timezone: 'Etc/UTC'
    groups:
      frontend:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 3

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:23'
      timezone: 'Etc/UTC'
    groups:
      e2e:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 2

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:23'
      timezone: 'Etc/UTC'
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 2
