[package]
name = "firewall-daemon"
version = "2.2.0"
edition = "2021"
rust-version = "1.75"
description = "Linux firewall user-space daemon (Rust port of fail2ban's fail2ban functionality)"
license = "MIT"
authors = ["SnowCore8 <snowcore8@gmail.com>"]

# 二进制名固定为 firewall-daemon, 与 C 版完全一致, 保证所有 bash 测试套件无需修改
[[bin]]
name = "firewall-daemon"
path = "src/daemon/main.rs"

[lib]
name = "firewall_daemon"
path = "src/daemon/lib.rs"

# ============================================================================
# 依赖 - 选型理由
# ============================================================================
# libc + nix: 系统调用 (signal/inotify/poll/fs 等)
# serde/serde_yaml: 替换 libyaml 解析 YAML 配置
# regex: 替换 PCRE2, 语法与 PCRE 等价, 性能足够
# tiny_http: 替换 libmicrohttpd, 同步 API, 无 async 复杂度
# signal-hook: 替换 signal() + sa_handler 自定义实现
# inotify: 替换 inotify_init1/inotify_add_watch 系统调用包装
# parking_lot: 替换 pthread_rwlock, 性能更好且 API 简单
# chrono: 替换 localtime_r/strftime, 时间格式化
# anyhow: 统一错误处理
# base64: HTTP Basic Auth 解码
# slog: 结构化日志门面 + JSON Lines 输出 (替换自研 log.rs)
# rust-embed: Web UI 静态资源嵌入（HTML/CSS/JS 编译进二进制）
# ============================================================================
[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "fs", "poll", "inotify", "time", "process", "mount", "user"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
tiny_http = "0.12"
signal-hook = "0.3"
inotify = "0.10"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
base64 = "0.22"
slog = "2.7"
slog-term = "2.9"
slog-async = "2.8"
slog-scope = "4.4"
slog-json = "2.6"
rust-embed = "8.5"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
once_cell = "1.19"

[dev-dependencies]
serde_json = "1"

[profile.release]
# 生产 release: 4MB (LTO + strip + 关 debug)
opt-level = 2
lto = true
codegen-units = 1
debug = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# 调试用 release 副本: 与 release 同等优化但保留 DWARF + 符号表
# (现场 crash 时用 `addr2line -e firewall-daemon <addr>` 反推栈)
# 用法: cargo build --release --profile dev-with-debug
[profile.dev-with-debug]
inherits = "release"
debug = true
strip = false

# ============================================================================
# 内存检测 profile
# ============================================================================
# ASAN (AddressSanitizer): 重编 std + 所有 crate,检测堆/栈越界、
# use-after-free、double-free。运行时性能开销 2-3×,**仅 nightly** 可用。
#
# 用法 (本机装好 rustup + nightly 后):
#   rustup install nightly
#   cargo +nightly build --profile asan
#   cargo +nightly test --profile asan
#
# Miri (Rust 解释器): 不需 ASAN 那种重编 std,直接解释执行 unsafe 代码,
# 抓指针算术 UB、对齐违反、别名违规等 ASAN 抓不到的问题。
# 适合跑 [ban] 模块的 `write_to_fd` 单元测试。
#
# 用法:
#   rustup +nightly component add miri
#   cargo +nightly miri test
#
# 本项目 21 处 unsafe 块均带 `// SAFETY:` 注释(ban.rs / log.rs /
# file_monitor.rs / main.rs),ASAN/Miri 仍能再挡一层意外的 libc 误用。
[profile.asan]
inherits = "dev"
opt-level = 1
debug = true
lto = false

# ASAN 标志需要在 .cargo/config.toml 的 `[unstable] build-std = ["std"]`
# 才能重编 std。示例 .cargo/config.toml (项目未启用,需 opt-in):
#
# [unstable]
# build-std = ["std", "core", "alloc"]
# build-std-features = ["panic_abort"]
#
# [profile.asan]
# inherits = "dev"
# sanitizer = "address"
